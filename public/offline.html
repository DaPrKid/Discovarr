<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e14" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · Discovarr</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(900px 420px at 12% -10%, #211a45 0%, transparent 60%),
          radial-gradient(700px 380px at 88% 0%, #102a3d 0%, transparent 55%),
          #0c0e14;
        color: #e8ecf6;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: min(26rem, 100%);
        padding: 28px 22px;
        border: 1px solid #262c3d;
        border-radius: 14px;
        background: #141824;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 { margin: 14px 0 8px; font-size: 1.45rem; letter-spacing: -0.02em; }
      p { margin: 0; color: #8d97ad; }
      form { margin-top: 18px; }
      button, a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #7c5cff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .links { margin-top: 14px; }
      .links a { color: #a48bff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>You're offline</h1>
      <p>Discovarr can't reach the server right now. Nothing on your account was saved on this device, so this page is only a stand-in until the connection comes back.</p>
      <form method="get">
        <button type="submit">Try again</button>
      </form>
      <p class="links"><a href="/">Back to Discover</a></p>
    </main>
  </body>
</html>
