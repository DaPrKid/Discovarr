services:
  discovarr:
    build:
      context: .
    image: discovarr:local
    container_name: discovarr
    ports:
      - "5057:5057"
    environment:
      PORT: "5057"
      DATABASE_FILE: /data/discovarr.db
      # Optional hands-off bootstrap. Leave ADMIN_PASSWORD empty and the first
      # administrator is created in the browser at /setup on first start.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      # Unraid defaults: nobody (99) / users (100). Override with PUID/PGID.
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - discovarr-data:/data
    restart: unless-stopped

volumes:
  discovarr-data:
