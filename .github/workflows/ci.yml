name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No runtime npm dependencies, so there is nothing to install or cache.
      - name: node --test
        run: node --test

  container:
    name: Image, PUID/PGID drop and healthcheck
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t discovarr:ci .

      - name: Start it as PUID 99 / PGID 100
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name discovarr-ci \
            -p 5055:5055 \
            -e PUID=99 -e PGID=100 \
            -e ADMIN_PASSWORD=ci-password-not-secret \
            -v "$RUNNER_TEMP/data:/data" \
            discovarr:ci
          sleep 3
          echo "--- entrypoint output ---"
          docker logs discovarr-ci

      - name: The app process runs as 99:100, not root
        run: |
          set -euo pipefail
          # `docker exec` starts a new process as the image's default user (root),
          # so it cannot observe the drop. su-exec replaces the entrypoint, which
          # makes PID 1 the app itself.
          docker exec discovarr-ci cat /proc/1/status > "$RUNNER_TEMP/proc1.txt"
          grep -E '^(Name|Uid|Gid):' "$RUNNER_TEMP/proc1.txt"
          test "$(awk '/^Uid:/{print $2}' "$RUNNER_TEMP/proc1.txt")" = 99
          test "$(awk '/^Gid:/{print $2}' "$RUNNER_TEMP/proc1.txt")" = 100
          docker logs discovarr-ci 2>&1 | grep -q 'starting as 99:100'

      - name: /data belongs to 99:100 and the database landed there
        run: |
          set -euo pipefail
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP/data")
          echo "host ownership of the mounted /data: $owner"
          test "$owner" = "99:100"
          docker exec discovarr-ci ls -l /data
          docker exec discovarr-ci test -f /data/discovarr.db

      - name: HTTP health endpoint answers
        run: curl -fsS http://127.0.0.1:5055/api/v1/health

      - name: Docker HEALTHCHECK reaches healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' discovarr-ci)
            echo "check $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker inspect --format '{{json .State.Health}}' discovarr-ci
              exit 1
            fi
            sleep 3
          done
          echo "FAIL: healthcheck never reported healthy"
          exit 1

      - name: --user 99:100 skips the privilege drop
        run: |
          set -euo pipefail
          out=$(docker run --rm --user 99:100 discovarr:ci id 2>&1)
          echo "$out"
          echo "$out" | grep -q 'already running as uid 99'
          echo "$out" | grep -q 'uid=99'

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker inspect discovarr-ci || true
          docker logs discovarr-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f discovarr-ci || true
